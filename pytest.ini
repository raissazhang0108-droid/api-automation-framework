[pytest]
# 测试目录
testpaths = test_cases

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    integration: 集成测试
    p0: 优先级P0（最高）
    p1: 优先级P1
    p2: 优先级P2
    positive: 正向测试
    negative: 负向测试
    boundary: 边界测试
    security: 安全测试
    patients: 患者模块
    diagnosis: 诊断模块
    auth: 认证模块
    petstore: Petstore API测试
    skip_prod: 生产环境跳过

# 命令行选项
addopts =
    -v
    --tb=short
    --strict-markers
    # --maxfail=5  # 注释掉这行或删除
    --alluredir=reports/allure-results
    --clean-alluredir
    -p no:warnings

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 超时
timeout = 300

# 并行
# 使用 pytest -n auto 启用